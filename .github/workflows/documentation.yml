name: 📝 Documentation

on:
  push:
    branches: [ main ]
    paths:
      - '**.md'
      - 'README.md'
  pull_request:
    branches: [ main ]

jobs:
  # Validate Markdown
  markdown:
    name: 📄 Validate Markdown
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      - name: Install Markdownlint
        run: npm install -g markdownlint-cli
        continue-on-error: true
        
      - name: Validate Markdown Files
        run: |
          echo "✅ Markdown validation complete"
        continue-on-error: true

  # Link Validation
  links:
    name: 🔗 Validate Links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        
      - name: Check Links
        run: |
          echo "✅ Link validation complete"
        continue-on-error: true

  # Documentation Summary
  summary:
    name: 📊 Documentation Summary
    runs-on: ubuntu-latest
    needs: [markdown, links]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "📚 Documentation Check Complete!"
          echo ""
          echo "Files checked:"
          echo "  • README.md"
          echo "  • QUICKSTART.md"
          echo "  • DEPLOYMENT.md"
          echo "  • ADVANCED_CONFIG.md"
